<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>맵 충돌 점검</title>
<style>
  html, body { margin: 0; background: #222; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script type="module">
// 맵 충돌 점검 그림 (tools/map-check.mjs 가 띄워서 PNG 로 찍는다. 직접 열어도 된다)
// 주소 뒤 ?src=before 면 /before/ 폴더(고치기 전 사본)의 코드·맵으로 그린다.
const q = new URLSearchParams(location.search);
const before = q.get('src') === 'before';
const mapId = q.get('map') || 'monster-gym';
const base = before ? '/before/' : null;
const G = await import(base ? base + 'mapgrid.js' : '/shared/mapgrid.js');
const R = await import(base ? base + 'maprender.js' : '/maprender.js');
const { GAME } = await import(base ? base + 'config.js' : '/shared/config.js');
const map = await (await fetch(base ? `${base}${mapId}.json` : `/maps/${mapId}.json`)).json();
const g = G.buildGrid(map);
const r = GAME.radius;
const cv = document.getElementById('cv');
const c = cv.getContext('2d');
// ?view=overview: 선생님 맵 고르기 미리보기·여러 층 한눈에 보기 그림만 찍는다 (?w=·&h= 크기)
if (q.get('view') === 'overview' && R.renderOverview) {
  const w = Number(q.get('w')) || 1600;
  const h = Number(q.get('h')) || 1000;
  cv.width = w;
  cv.height = h;
  c.drawImage(R.renderOverview(map, R.renderMap(map, g, { mode: q.get('mode') || 'mafia' }), w, h), 0, 0);
  document.title = 'done';
  window.__done = true;
  throw new Error('overview only'); // 아래 점검 그림은 그리지 않는다
}
cv.width = map.size[0];
cv.height = map.size[1];
c.drawImage(R.renderMap(map, g, { mode: 'mafia' }), 0, 0);

// 1. 발 중심이 설 수 없는 바닥 (벽·건물 밖은 원래 막힌 곳이라 칠하지 않는다)
const S = 4;
const floorish = (x, y) => {
  const v = G.cellAt(g, x, y);
  return v !== G.WALL && v !== G.VOID;
};
c.fillStyle = 'rgba(255,30,30,.42)';
for (let y = 0; y < map.size[1]; y += S) {
  for (let x = 0; x < map.size[0]; x += S) {
    if (floorish(x + S / 2, y + S / 2) && !G.canStand(g, x + S / 2, y + S / 2, r)) c.fillRect(x, y, S, S);
  }
}

// 2. 시작 위치에서 걸어서 갈 수 있는 곳 (10px 격자, mapgrid.js 의 walkMap — 장치(계단 등)로 이어진 곳도 갈 수 있는 곳).
//    설 수는 있는데 못 가는 곳은 보라색
const { step, W, ok, seen } = G.walkMap(map, g, r);
c.fillStyle = 'rgba(160,40,255,.65)';
for (let k = 0; k < ok.length; k++) if (ok[k] && !seen[k]) c.fillRect((k % W) * step - 4, Math.floor(k / W) * step - 4, 8, 8);

// 3. 가구 그림 칸(파란 점선)과 실제로 막힌 칸(빨간 실선)
c.lineWidth = 2;
for (const f of map.furniture || []) {
  c.setLineDash([6, 5]);
  c.strokeStyle = '#2f7bff';
  c.strokeRect(...(G.drawnRect ? G.drawnRect(f) : f.rect));
  c.setLineDash([]);
  c.strokeStyle = '#ff1e1e';
  const foot = g.foots ? g.foots[map.furniture.indexOf(f)] : f.rect;
  c.strokeRect(...foot);
}

// 4. 점검에서 걸린 곳 (새 코드에만 있는 inspectMap)
if (G.inspectMap) {
  for (const p of G.inspectMap(map, g, r)) {
    if (!p.at) continue;
    c.strokeStyle = '#ffe600';
    c.lineWidth = 5;
    c.beginPath();
    c.arc(p.at[0], p.at[1], 34, 0, Math.PI * 2);
    c.stroke();
  }
}

// 5. 범례
const lines = [
  before ? '고치기 전' : '고친 뒤',
  '빨강 칠: 발 중심이 설 수 없는 바닥 (보이지 않는 벽 포함)',
  '빨간 선: 실제로 막힌 영역   파란 점선: 가구 그림 영역',
  '보라: 설 수는 있지만 시작 위치에서 갈 수 없는 곳   노란 원: 점검에서 걸린 곳',
];
c.font = '700 26px "Malgun Gothic", sans-serif';
c.fillStyle = 'rgba(0,0,0,.72)';
const ly = map.size[1] - 140; // 범례는 맵 왼쪽 아래
c.fillRect(10, ly, 900, 130);
c.fillStyle = '#fff';
lines.forEach((t, i) => c.fillText(t, 24, ly + 30 + i * 30));
document.title = 'done';
window.__done = true;
</script>
</body>
</html>
